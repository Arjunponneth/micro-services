groups:
  - name: docker-container-alerts
    rules:

      - alert: HighContainerCPU
        expr: sum by (name) (
                rate(container_cpu_usage_seconds_total{name!=""}[5m])
              ) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High container CPU usage"
          description: "Container {{ $labels.name }} CPU usage is above 80%."
