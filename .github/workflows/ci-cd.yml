name: Payment App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular frontend
        working-directory: frontend
        run: npm run build


  auth-service-build:
    name: Auth Service Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install auth service dependencies
        working-directory: backend/auth_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify auth service
        working-directory: backend/auth_service
        run: |
          python -m compileall src


  payment-service-build:
    name: Payment Service Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install payment service dependencies
        working-directory: backend/payment_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify payment service
        working-directory: backend/payment_service
        run: |
          python -m compileall src


  frontend-sonarqube:
    name: Frontend SonarQube Analysis
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Frontend Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=micoservice
            -Dsonar.projectName=micoservice
            -Dsonar.sources=src


  auth-sonarqube:
    name: Auth Service SonarQube Analysis
    runs-on: ubuntu-latest
    needs: auth-service-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Auth Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: backend/auth_service
          args: >
            -Dsonar.projectKey=micoservice-auth
            -Dsonar.projectName=micoservice-auth
            -Dsonar.sources=src


  payment-sonarqube:
    name: Payment Service SonarQube Analysis
    runs-on: ubuntu-latest
    needs: payment-service-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Payment Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: backend/payment_service
          args: >
            -Dsonar.projectKey=micoservice-payment
            -Dsonar.projectName=micoservice-payment
            -Dsonar.sources=src
   
    
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: self-hosted
    needs:
      - frontend-sonarqube
      - auth-sonarqube
      - payment-sonarqube

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            arjunponneth/frontend:${{ github.sha }}
            arjunponneth/frontend:latest

      - name: Build and push auth service image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/auth_service
          file: ./backend/auth_service/Dockerfile
          push: true
          tags: |
            arjunponneth/auth-service:${{ github.sha }}
            arjunponneth/auth-service:latest

      - name: Build and push payment service image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/payment_service
          file: ./backend/payment_service/Dockerfile
          push: true
          tags: |
            arjunponneth/payment-service:${{ github.sha }}
            arjunponneth/payment-service:latest
  deploy:
   name: Deploy with Docker Compose
   runs-on: self-hosted

   needs:
    - docker-build-push

   steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Nexus
      run: |
        echo "${{ secrets.NEXUS_PASSWORD }}" | docker login \
          ${{ secrets.NEXUS_HOST }} \
          -u "${{ secrets.NEXUS_USERNAME }}" \
          --password-stdin

    - name: Pull latest images
      run: |
        docker compose pull

    - name: Deploy application
      run: |
        docker compose up -d

    - name: Check running containers
      run: |
        docker compose ps
        
