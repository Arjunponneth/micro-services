name: Payment App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular frontend
        working-directory: frontend
        run: npm run build


  auth-service-build:
    name: Auth Service Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install auth service dependencies
        working-directory: backend/auth_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify auth service
        working-directory: backend/auth_service
        run: |
          python -m compileall src


  payment-service-build:
    name: Payment Service Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install payment service dependencies
        working-directory: backend/payment_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify payment service
        working-directory: backend/payment_service
        run: |
          python -m compileall src
